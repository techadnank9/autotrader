<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Today's picks — AI Trader</title>
<meta name="theme-color" content="#08090B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=20260923161640">
<link rel="stylesheet" href="/static/dashboard.css?v=20260923161640">
</head>
<body>
<main class="page">
  <p class="welcome" id="welcome" role="status" hidden></p>
  <a class="tg-nudge" id="tg-nudge" href="/alerts" hidden><span>Get today's picks on your phone every morning, with a Buy button.</span><b>Connect Telegram</b></a>
  <p class="demo-note" id="demo-note" hidden>You're exploring a demo. Create an account and connect a broker to buy.</p>

  <section class="call" aria-labelledby="picks-h">
    <div class="call-head">
      <div>
        <h1 id="picks-h">Today's picks</h1>
        <p class="panel-sub" id="picks-sub">&nbsp;</p>
      </div>
      <button class="btn btn-quiet btn-sm" id="refresh" type="button" hidden>Refresh</button>
    </div>
    <div id="picks"><p class="skel">Loading today's picks…</p></div>
  </section>

  <section class="panel" aria-labelledby="acct-h">
    <div class="panel-head">
      <h2 id="acct-h">Your account</h2>
      <a class="btn btn-quiet btn-sm" href="/portfolio">View portfolio</a>
    </div>
    <div id="acct"><p class="empty">Loading…</p></div>
  </section>
</main>
<script src="/static/charts.js?v=20260923161640"></script>
<script src="/static/shell.js?v=20260923161640"></script>
<script src="/static/dashboard.js?v=20260923161640"></script>
</body>
</html>
