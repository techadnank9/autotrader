<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile — AI Trader</title>
<meta name="theme-color" content="#08090B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=20260921165253">
<link rel="stylesheet" href="/static/dashboard.css?v=20260921165253">
</head>
<body>

<main class="page">
  <section class="call">
    <h1 style="font-size:24px">Profile</h1>
    <dl class="stats" id="me"></dl>
  </section>

  <section class="panel" aria-labelledby="bk-h">
    <h2 id="bk-h">Brokerage</h2>
    <p class="panel-sub">Connect your own brokerage account. Approved calls are placed there, and only there.</p>
    <p class="note" id="bk-note" hidden></p>
    <div id="bk"><p class="empty">Checking…</p></div>
  </section>


  <section class="panel" aria-labelledby="lim-h">
    <h2 id="lim-h">Limits</h2>
    <p class="panel-sub">Every order is held to these. They can't be raised from inside the app.</p>
    <dl class="stats" id="limits"></dl>
  </section>

  <footer class="foot"><p>Prototype software, not a brokerage and not investment advice.</p></footer>
</main>

<script src="/static/charts.js?v=20260921165253"></script>
<script src="/static/shell.js?v=20260921165253"></script>
<script src="/static/broker.js?v=20260921165253"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function money(v){var n=Number(v);if(!isFinite(n))n=0;return "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
  async function api(u,o){var r=await fetch(u,o);var d=await r.json().catch(function(){return{}});if(!r.ok)throw new Error(d.detail||("HTTP "+r.status));return d}
  function stat(l,v,txt){return '<div><dt>'+esc(l)+'</dt><dd'+(txt?' class="txt"':'')+'>'+esc(v)+'</dd></div>'}
  function row(name, state, detail){
    var cls = state==="on"?"on":(state==="warn"?"warn":"");
    var label = state==="on"?"Connected":(state==="warn"?"Needs attention":"Not connected");
    return '<div class="conn-row"><span class="conn-name">'+esc(name)+'</span><span class="conn-detail">'+esc(detail)+'</span><span class="pill '+cls+'"><i></i>'+label+'</span></div>';
  }


  async function boot(){
    var u = await window.Shell.mount({ active: "profile" });
    if (!u) return;
    $("me").innerHTML = stat("Email", u.email, true) +
      stat("Account type", u.is_demo ? "Demo session" : "Member", true) +
      stat("Member since", u.created_at ? new Date(u.created_at*1000).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "—", true);

    window.BrokerConnect.mount({
      root: $("bk"), note: $("bk-note"), returnTo: "/profile",
      onChange: function(){},
    });
    renderLimits();
  }

  async function renderLimits(){
    var cfg={};
    try{ cfg=await api("/api/config"); }catch(e){}
    var pol=cfg.portfolio_policy||{};
    $("limits").innerHTML = stat("Max order", money(cfg.max_budget_usd)) + stat("Cash reserve", money(pol.cash_reserve_usd)) +
      stat("Max positions", String(pol.max_positions||"—")) + stat("Instruments", "Long-only US equities", true);
  }
  boot();
})();
</script>
</body>
</html>
