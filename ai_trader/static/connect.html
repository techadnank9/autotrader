<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect your brokerage — AI Trader</title>
<meta name="theme-color" content="#08090B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=20260921173257">
<link rel="stylesheet" href="/static/dashboard.css?v=20260921173257">
<style>
  .onb{max-width:880px;margin:0 auto;padding:clamp(32px,6vw,64px) clamp(18px,4vw,32px) 72px}
  .progress{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:220px}
  .progress i{height:4px;border-radius:99px;background:var(--line)}
  .progress i.done{background:var(--accent)}
  .onb h1{margin-top:28px;font-size:clamp(1.8rem,3.4vw,2.4rem)}
  .onb .lede{margin-top:14px;color:var(--text-2);max-width:58ch;font-size:16px}
  .onb .panel{margin-top:30px}
  .signed{margin-top:22px;font-size:13.5px;color:var(--text-3)}
  .signed button{background:none;border:0;padding:0;color:var(--text-2);font:inherit;text-decoration:underline;text-underline-offset:.2em;cursor:pointer}
</style>
</head>
<body>
<header class="topbar">
  <div class="bar">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="21" height="21" rx="6.5" stroke="#C8F24C" stroke-width="1.5"/><path d="M6.5 15.5L10 11l3 3 4.5-6" stroke="#C8F24C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      AI Trader
    </a>
  </div>
</header>

<main class="onb">
  <div class="progress" role="img" aria-label="Setup: account created, brokerage next"><i class="done"></i><i></i></div>
  <h1>Connect your brokerage</h1>
  <p class="lede">AI Trader places the calls you approve in your own account, and nowhere else. Connect one to finish setting up. You can switch or disconnect anytime from Profile.</p>

  <section class="panel" aria-label="Choose a brokerage">
    <p class="note" id="bk-note" hidden></p>
    <div id="bk"><p class="empty">Checking…</p></div>
  </section>

  <p class="signed">Signed in as <span id="who">…</span> · <button type="button" id="signout">Sign out</button></p>
</main>

<script src="/static/broker.js?v=20260921173257"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  fetch("/api/auth/me").then(function(r){ return r.json(); }).then(function(me){
    if (!me.authenticated) { location.href = "/login"; return; }
    $("who").textContent = me.user.email;
  }).catch(function(){ location.href = "/login"; });

  $("signout").onclick = async function(){
    try { await fetch("/api/auth/logout", { method: "POST" }); } catch (e) {}
    location.href = "/login";
  };

  window.BrokerConnect.mount({
    root: $("bk"), note: $("bk-note"), returnTo: "/connect",
    onChange: function(state){ if (state.connected) location.href = "/app?welcome=" + state.provider; },
  });
})();
</script>
</body>
</html>
